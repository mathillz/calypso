<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CodeCraft AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    :root {
      --cc-primary: #6c5ce7;
      --cc-secondary: #a29bfe;
      --cc-accent: #00cec9;
      --cc-dark: #0a0a1a;
      --cc-darker: #06060f;
      --cc-card: #12122a;
      --cc-border: #1e1e3a;
      --cc-text: #e0e0f0;
      --cc-muted: #8888aa;
    }
    body {
      background: var(--cc-dark);
      color: var(--cc-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }
    .sidebar {
      background: var(--cc-darker);
      border-right: 1px solid var(--cc-border);
      min-height: 100vh;
      width: 260px;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      padding-top: 1rem;
    }
    .sidebar .brand {
      padding: 0.5rem 1.25rem 1.5rem;
      border-bottom: 1px solid var(--cc-border);
      margin-bottom: 1rem;
    }
    .sidebar .brand h4 {
      background: linear-gradient(135deg, var(--cc-primary), var(--cc-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      margin: 0;
    }
    .sidebar .nav-link {
      color: var(--cc-muted);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      margin: 2px 0.75rem;
      transition: all 0.2s;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      color: #fff;
      background: rgba(108, 92, 231, 0.15);
    }
    .sidebar .nav-link.active {
      background: rgba(108, 92, 231, 0.25);
    }
    .sidebar .nav-link i {
      width: 24px;
      margin-right: 8px;
    }
    .main-content {
      margin-left: 260px;
      min-height: 100vh;
    }
    .card {
      background: var(--cc-card);
      border: 1px solid var(--cc-border);
      border-radius: 12px;
    }
    .card:hover {
      border-color: var(--cc-primary);
    }
    .btn-primary {
      background: var(--cc-primary);
      border-color: var(--cc-primary);
    }
    .btn-primary:hover {
      background: #5a4bd4;
      border-color: #5a4bd4;
    }
    .btn-accent {
      background: var(--cc-accent);
      border-color: var(--cc-accent);
      color: #000;
    }
    .code-block {
      background: #1a1a2e;
      border: 1px solid var(--cc-border);
      border-radius: 8px;
      margin: 0.75rem 0;
      overflow: hidden;
    }
    .code-header {
      background: rgba(108, 92, 231, 0.1);
      padding: 0.4rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cc-border);
    }
    .code-lang {
      color: var(--cc-accent);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .code-block pre {
      margin: 0;
      padding: 1rem;
      overflow-x: auto;
    }
    .code-block code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: var(--cc-text);
    }
    .badge-platform {
      font-size: 0.7rem;
      padding: 0.3em 0.6em;
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--cc-primary), var(--cc-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column">
    <div class="brand">
      <h4><i class="bi bi-braces-asterisk"></i> CodeCraft AI</h4>
      <small class="text-muted">Intelligent Code Agent</small>
    </div>
    <ul class="nav flex-column flex-grow-1">
      <li class="nav-item">
        <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="{% url 'dashboard' %}">
          <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_chat %}{% endblock %}" href="{% url 'chat' %}">
          <i class="bi bi-chat-dots"></i> Chat
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_projects %}{% endblock %}" href="{% url 'projects' %}">
          <i class="bi bi-folder-symlink"></i> Projects
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_prompts %}{% endblock %}" href="{% url 'prompt_manager' %}">
          <i class="bi bi-file-earmark-text"></i> Prompts
        </a>
      </li>
    </ul>
    <div class="p-3 border-top" style="border-color: var(--cc-border) !important;">
      <small class="text-muted">
        <i class="bi bi-cpu"></i> CodeCraft AI v1.0
      </small>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <div class="p-4">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function copyCode(btn) {
      const codeBlock = btn.closest('.code-block').querySelector('code');
      navigator.clipboard.writeText(codeBlock.textContent);
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
